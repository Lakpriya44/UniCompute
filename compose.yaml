
name: unicompute

services:

  db:
    image: postgres:16
    container_name: unicompute-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: unicompute
      POSTGRES_USER: unicompute_user
      POSTGRES_PASSWORD: dev_password_123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicompute_user -d unicompute"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: unicompute-adminer
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

